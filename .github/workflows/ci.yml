name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.archive.outputs.artifact_name }}
      archive_name: ${{ steps.archive.outputs.archive_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build production extension
        run: pnpm build

      - name: Package Chrome extension
        run: pnpm package

      - name: Verify extension archive
        run: |
          pnpm verify:package
          unzip -t build/chrome-mv3-prod.zip

      - name: Prepare versioned archive
        id: archive
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact_name="book-walker-marker-plus-${version}-chrome"
          archive_name="${artifact_name}.zip"
          test -f build/chrome-mv3-prod.zip
          mkdir -p artifacts
          cp build/chrome-mv3-prod.zip "artifacts/${archive_name}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload extension archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: artifacts/${{ steps.archive.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${expected}." >&2
            exit 1
          fi

      - name: Download extension archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
        shell: bash
        run: |
          archive="artifacts/${ARCHIVE_NAME}"
          test -f "${archive}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" \
              --verify-tag \
              --generate-notes \
              --title "Book Walker Marker Plus ${GITHUB_REF_NAME}"
          fi
